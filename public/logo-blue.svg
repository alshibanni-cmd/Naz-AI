<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naz AI Logo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    .logo {
      display: block;
      width: min(92vw, 900px);
      height: auto;
      background: transparent;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img class="logo" src="naz_ai_logo_transparent.png" alt="Naz AI logo">
</body>
</html>